<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script type="module" src="js/new-site.js"></script>
</head>
<body>
  <main class="container py-5">
    <h1 class="text-center mb-4">Nuevo sitio</h1>

    <form id="site-form">
        <div class ="mb-3">    
            <label for="name" class="form-label">Nombre del sitio:</label>
            <input type="text" id="name" class="form-control" required />
        </div>

        <div class="mb-3">
            <label for="url" class="form-label">URL:</label>
            <input type="url" id="url" class="form-control" required />
        </div>
        <div class="mb-3">
            <label for="user" class="form-label">Usuario</label>
            <input type="text" id="user" class="form-control" required />
          </div>
    
          <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <div class="input-group">
              <input type="text" id="password" class="form-control" placeholder="Password" required />
              <button type="button" id="generatePass" class="btn btn-outline-secondary">Generar</button>
              <button type="button" id="copyPass" class="btn btn-outline-secondary">Copiar</button>
            </div>
          </div>
    
          <div class="mb-3">
            <label for="description" class="form-label">Descripción</label>
            <input type="text" id="description" class="form-control" />
          </div>
    
          <div class="mb-3">
            <label for="category" class="form-label">Categoría</label>
            <select id="category" class="form-select" required>
              <option value="">Elige una categoría</option>
            </select>
          </div>
    
          <button type="submit" class="btn btn-primary">Crear sitio</button>
        </form>
    
        <p id="message" class="mt-3"></p>

        <h2 class="mt-5">Listado de sitios</h2>
        <ul id="site-list" class="list-group"></ul>

      </main>
    
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    </body>
    </html>
