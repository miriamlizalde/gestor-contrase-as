<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script type="module" src="js/new-category.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <main class="container py-5">
    <h1 class="text-center mb-4">Añadir nueva categoría</h1>

    <form id="form-category">
      <div class="mb-3">
        <label for="name" class="form-label">Nombre de la categoría</label>
        <input type="text" id="name" name="name" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary">Guardar</button>
    </form>

    <p id="message" class="mt-3"></p>

    <hr class="my-4">
    <h2 class="h5 mb-3">Listado de categorías</h2>
    <ul class="list-group" id="category-list"></ul>

    <a href="index.html" class="btn btn-link mt-4">← Volver al inicio</a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
